<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Client Portal</title>
<style>body{margin:0;background:#f6f7f9;color:#5f6b7a;font:15px system-ui,sans-serif;display:flex;min-height:100vh;align-items:center;justify-content:center}@media(prefers-color-scheme:dark){body{background:#121519;color:#9aa6b4}}</style>
</head><body><div id="boot">Loading…</div>
<script>
// Loader: the portal app is published to Supabase storage by the accountant's agent; this page only fetches and runs it,
// so updates never need a GitHub change. The hash (auth tokens) stays in the URL because document.write keeps the location.
(async () => {
  const src = 'https://vuqydfqlfnzfwsosbrmo.supabase.co/storage/v1/object/public/portal/app.html?v=' + Math.floor(Date.now() / 60000);
  try {
    const r = await fetch(src, { cache: 'no-store' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const html = await r.text();
    document.open(); document.write(html); document.close();
  } catch (e) {
    document.getElementById('boot').textContent = 'The portal could not load (' + e.message + '). Please refresh in a minute or contact your accountant.';
  }
})();
</script></body></html>
